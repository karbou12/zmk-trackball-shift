description: Input Processor for rotation xy input of trackball device

compatible: "zmk,input-processor-trackball-shift"

include: ip_zero_param.yaml

properties:
  default-device-angle-degree:
    description: |
      default device angle [deg] for trackball shift.
      if non-zero, this value must be a multiple of the direction_angle_deg, and a divisor of 360.
    type: int
    default: 0
