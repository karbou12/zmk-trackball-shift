description: Input Processor for detecion the direction of trackball device

compatible: "zmk,input-processor-trackball-direction-detection"

include: ip_zero_param.yaml

properties:
  distance-threshold:
    description: threshold of distance for direction detection of trackball shift.
    type: int
    default: 800

  detection-sample-time-ms:
    description: sample time [ms] for direction detection of trackball shift.
    type: int
    default: 100
