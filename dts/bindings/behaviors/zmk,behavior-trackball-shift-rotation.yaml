description: trackball shift cw/ccw rotation behavior

compatible: "zmk,behavior-trackball-shift-rotation"

include: one_param.yaml

properties:
  step-angle-deg:
    description: the step of the rotation angle of the device, the range is from 3 to 45. it rotates angle with direction-angle-deg when total step is greather than direction-angle-deg within sample-time-ms. 
    type: int
    default: 45
